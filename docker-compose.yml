services:
  obrail_db:
    image: postgres:15
    container_name: obrail_postgres_db
    env_file:
      - .env
    ports:
      - "5433:5432"                    # ← MUST be 5433!
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obrail_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  obrail_network:

volumes:
  postgres_data: