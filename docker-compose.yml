version: '3.8'
services:
  db:
    image: postgres:15
    container_name: obrail_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: obrail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: obrail_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/obrail_db
    depends_on:
      - db

volumes:
  postgres_data: