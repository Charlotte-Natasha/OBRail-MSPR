version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: datamart_co2_pg
    environment:
      POSTGRES_DB: datamart_co2
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
